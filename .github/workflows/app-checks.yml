name: App checks

# Reusable job: install, audit, lint and build one app of the monorepo.
# Called by checks-<app>.yml, which decide when it runs (paths) and cancel stale runs.

on:
  workflow_call:
    inputs:
      app:
        description: Workspace package name, e.g. @bpagoaga/portfolio
        required: true
        type: string

jobs:
  checks:
    name: Lint and build
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
      ASTRO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails when pnpm-lock.yaml is out of sync with the package.json files.
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm turbo run lint --filter=${{ inputs.app }}

      # Runs even when lint or audit failed, so a single push reports every problem.
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm turbo run build --filter=${{ inputs.app }}
