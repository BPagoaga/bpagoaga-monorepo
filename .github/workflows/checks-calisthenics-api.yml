name: Checks — Calisthenics API

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    # The app itself, what it depends on, and the shared tooling.
    paths:
      - apps/calisthenics-api/**
      - packages/calisthenics-core/**
      - packages/calisthenics-api-client/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - vite.config.ts
      - tsconfig.json
      - .nvmrc
      - .github/workflows/app-checks.yml
      - .github/workflows/checks-calisthenics-api.yml

# A new push on the same PR cancels the run still in progress.
concurrency:
  group: checks-calisthenics-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  calisthenics-api:
    uses: ./.github/workflows/app-checks.yml
    with:
      app: '@bpagoaga/calisthenics-api'

  # openapi.json and the generated client are committed: they must match the API's routes.
  client-up-to-date:
    name: Generated client up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate openapi.json and the client
        run: pnpm generate:api
      - name: Fail if they changed
        run: |
          # --porcelain also catches new and deleted generated files.
          if [ -n "$(git status --porcelain -- apps/calisthenics-api/openapi.json packages/calisthenics-api-client/src/generated)" ]; then
            git status --short -- apps/calisthenics-api/openapi.json packages/calisthenics-api-client/src/generated
            echo "::error::openapi.json or the generated client is out of date: run 'pnpm generate:api' and commit the result."
            exit 1
          fi
