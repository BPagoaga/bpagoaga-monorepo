# Local Postgres for development: `pnpm --filter @bpagoaga/calisthenics-api db:up`.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: calibuddy
      POSTGRES_PASSWORD: calibuddy
      POSTGRES_DB: calibuddy
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U calibuddy -d calibuddy']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
