channels: [web, mobile]
notes: >
  Ordre de lecture : ce qu'il faut faire maintenant (prochaine étape), puis où j'en suis
  (indicateurs), puis le détail. Une seule action accent (« Démarrer la séance ») — sur
  mobile, c'est le bouton central de la barre d'onglets qui la porte. « Démarrer la séance »
  ouvre MOCK-204 avec la séance du programme pré-sélectionnée ; le premier lancement mène
  au test de niveau (MOCK-206).
