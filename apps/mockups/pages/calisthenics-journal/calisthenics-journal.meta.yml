id: MOCK-202
title: Journal de séances
status: implemented
app: calisthenics
area: Journal
implemented_in: apps/calisthenics/src/pages
states:
  - historique groupé par semaine (dépliée / repliée)
  - séance en cours en colonne (desktop)
  - séance en cours plein écran (mobile, variante v2)
  - repos en cours
channels: [web, mobile]
notes: >
  Sur desktop, la séance en cours vit à côté de l'historique pour comparer avec la séance
  précédente. Sur mobile, c'est un écran dédié : l'historique y est à un tap. On y arrive
  depuis « Démarrer une séance » (MOCK-204). Le set logger ne saisit que répétitions + lest :
  les exercices tenus (L-sit, hollow) demandent un mode durée, à maquetter.
  « Exporter » sert aussi de sauvegarde tant que les données sont locales.
