packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  '@types/node': ^24
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  tailwindcss: ^4.2.2
  '@tailwindcss/vite': ^4.2.2
  '@tailwindcss/cli': ^4.2.2
  '@astrojs/check': ^0.9.12
  '@fortawesome/free-brands-svg-icons': ^7.3.1
  '@fortawesome/free-solid-svg-icons': ^7.3.1
  '@storybook/react-vite': ^10.6.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  storybook: ^10.6.3
  '@vitejs/plugin-react': ^6.1.2

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
