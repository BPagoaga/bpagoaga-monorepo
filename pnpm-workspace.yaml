packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  '@types/node': ^24
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  tailwindcss: ^4.2.2
  '@tailwindcss/vite': ^4.2.2
  '@tailwindcss/cli': ^4.2.2
  '@astrojs/check': ^0.9.12
  '@fortawesome/free-brands-svg-icons': ^7.3.1
  '@fortawesome/free-solid-svg-icons': ^7.3.1
  '@storybook/react-vite': ^10.6.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  storybook: ^10.6.3
  '@vitejs/plugin-react': ^6.1.2
  '@tanstack/react-query': ^5.105.0
  react-router: ^8.5.0
  zod: ^4.6.7
  '@hono/node-server': ^2.1.5
  '@hono/zod-openapi': ^1.6.3
  '@scalar/hono-api-reference': ^0.12.14
  better-auth: ^1.7.14
  drizzle-orm: ^0.45.4
  hono: ^4.13.14
  postgres: ^3.4.9
  '@electric-sql/pglite': ^0.5.12
  drizzle-kit: ^0.31.11
  tsx: ^4.23.15
  orval: ^8.45.0

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

auditConfig:
  # Accepted risks, both pulled in by @expo/cli (Expo's dev/build CLI, never bundled in the app).
  # Remove each entry once @expo/cli ships a fixed dependency (check `pnpm why <pkg> -r`).
  ignoreGhsas:
    # node-forge ≤1.4.0, RSA PKCS#1 v1.5 signature check: no patched version exists yet.
    - GHSA-86w9-cpqp-85rv
    # zod <4.6.6, memory exhaustion on oversized collections: @expo/cli requires zod ^3, not fixed on 3.x.
    - GHSA-mrhx-c7xc-m3w5
