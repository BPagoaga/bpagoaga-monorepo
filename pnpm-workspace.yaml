packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  '@types/node': ^24
  typescript: ~6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  tailwindcss: ^4.2.2
  '@tailwindcss/vite': ^4.2.2
  '@tailwindcss/cli': ^4.2.2
  '@astrojs/check': ^0.9.12

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

allowBuilds:
  '@parcel/watcher': true
